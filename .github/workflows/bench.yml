name: Benchmark

# Keeps data/latest.json current. Committing it to main triggers the Pages
# workflow, so a successful run here redeploys the site with fresh numbers.
#
# Two schedules, deliberately different in cost:
#
#   hourly  refresh-aa  <=1 Artificial Analysis request, 0 OpenRouter requests.
#                       Free. Refreshes the home tab.
#   daily   run         Full 5-trial measurement sweep through OpenRouter.
#                       Paid, a few cents. Gives medians worth trusting, which
#                       hourly n=1 sampling would not.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Which harness command to run
        type: choice
        options: [refresh-aa, validate, run]
        default: refresh-aa
      models:
        description: 'Comma-separated model keys (blank = all enabled)'
        type: string
        default: ''
      refresh:
        description: Force a live Artificial Analysis request
        type: boolean
        default: false
  schedule:
    - cron: '0 * * * *' # every hour, on the hour — AA only
    - cron: '40 6 * * *' # daily 06:40 UTC — full measured run

permissions:
  contents: write

# Never let two runs race on the same commit.
concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install
        working-directory: harness
        run: npm ci

      # Which command runs depends on how the workflow was triggered. A manual
      # dispatch wins; otherwise the cron expression picks.
      - name: Decide command
        id: pick
        run: |
          if [ -n "${{ inputs.command }}" ]; then
            echo "command=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = '40 6 * * *' ]; then
            echo "command=run" >> "$GITHUB_OUTPUT"
          else
            echo "command=refresh-aa" >> "$GITHUB_OUTPUT"
          fi

      - name: Benchmark
        working-directory: harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTIFICIALANALYSIS_API_KEY: ${{ secrets.ARTIFICIALANALYSIS_API_KEY }}
          AA_HOURLY_BUDGET: '3'
          AA_DAILY_BUDGET: '75'
        run: |
          npm run bench -- "${{ steps.pick.outputs.command }}" \
            ${{ inputs.models && format('--models {0}', inputs.models) || '' }} \
            ${{ inputs.refresh && '--refresh' || '' }}

      # data/ is generated output, not authored work: the newest run is always
      # the one we want. So instead of merging or rebasing — which would
      # conflict on data/latest.json, a file every run rewrites — we replay our
      # fresh output on top of whatever main currently points at.
      #
      # The loop covers the gap between fetching and pushing, where another
      # run or a human push can land first.
      - name: Commit results
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          staging="$(mktemp -d)"
          cp -R data/. "$staging/"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            rm -rf data
            mkdir -p data
            cp -R "$staging/." data/

            git add data/
            if git diff --staged --quiet; then
              echo 'No change in results; nothing to commit.'
              exit 0
            fi

            git commit -m "chore(data): refresh via ${{ steps.pick.outputs.command }}"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt; main moved. Retrying."
            sleep $(( attempt * 5 ))
          done

          echo 'Could not push after 3 attempts.' >&2
          exit 1
